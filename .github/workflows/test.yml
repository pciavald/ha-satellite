name: Test matrix

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same libraries as the Dockerfile and the upstream test workflow; a
      # PulseAudio daemon with its automatic null sink stands in for the sound
      # server, because soundcard connects to it when it is imported on Linux.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libmpv-dev mpv libasound2-plugins pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl info

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee install.log || { tail -n 40 install.log | python .github/annotate.py install; exit 1; }
          python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"

      # DYLD_* variables are stripped when a SIP-protected binary such as bash
      # starts, so the library path is exported inside the step itself.
      - name: Run unit tests
        run: |
          if [ -n "${LIBMPV_DIR:-}" ]; then export DYLD_FALLBACK_LIBRARY_PATH="$LIBMPV_DIR"; fi
          python -m pytest tests/unit -ra --junitxml=junit.xml 2>&1 | tee pytest.log || { tail -n 60 pytest.log | python .github/annotate.py pytest; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: warn

  # The macOS port in one job: the menu bar app (Swift unit tests, including
  # the fixtures shared with Python), the Python suite installed from the pins
  # the app bundles, and the self-contained app, ad hoc signed (no secret in
  # CI), checked and uploaded as HA-Satellite-macos-arm64.zip.
  macos:
    name: macOS (app and Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: macos/requirements.txt

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # libmpv from Homebrew: for the Python tests, and copied into the app
      # with its FFmpeg, which the app's PyAV is built against (pkgconf).
      - name: Install libmpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install mpv pkgconf
          echo "LIBMPV_DIR=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install the project from macos/requirements.txt
        run: |
          python -m pip install --upgrade pip
          { python -m pip install -r macos/requirements.txt && python -m pip install -e ".[dev]"; } 2>&1 | tee install.log || { tail -n 40 install.log | python .github/annotate.py install; exit 1; }
          python -m pip check

      - name: Build the app
        run: swift build --package-path macos/HASatellite 2>&1 | tee swift-build.log || { grep -E "error:" swift-build.log | head -n 40 | python .github/annotate.py "swift build"; exit 1; }

      - name: Run Swift tests
        run: swift test --package-path macos/HASatellite 2>&1 | tee swift-test.log || { grep -E "error:|failed|Fatal|crashed" swift-test.log | head -n 40 | python .github/annotate.py "swift test"; exit 1; }

      - name: Build the self-contained app (ad hoc signed)
        env:
          LVA_SIGN_IDENTITY: "-"
        run: macos/build.sh build 2>&1 | tee app-build.log || { tail -n 40 app-build.log | python .github/annotate.py "app build"; exit 1; }

      # Nothing loaded from outside the bundle; the bundled interpreter loads
      # LVA, its native dependencies, libmpv and the wake word models.
      - name: Check the app bundle
        run: macos/build.sh check

      - name: Zip the app
        run: ditto -c -k --keepParent "macos/HASatellite/.build/HA Satellite.app" HA-Satellite-macos-arm64.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          path: HA-Satellite-macos-arm64.zip
          archive: false
          retention-days: 30
          if-no-files-found: error

      # DYLD_* variables are stripped when a SIP-protected binary such as bash
      # starts, so the library path is exported inside the step itself.
      - name: Run Python unit tests
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$LIBMPV_DIR"
          python -m pytest tests/unit -ra --junitxml=junit.xml 2>&1 | tee pytest.log || { tail -n 60 pytest.log | python .github/annotate.py pytest; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-macos-py3.13
          path: junit.xml
          if-no-files-found: warn
